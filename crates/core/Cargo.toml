[package]
name = "onionring-core"
description = "Library scanning, launching, art and installs for OnionRing"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "onionring_core"

[[bin]]
name = "onionring-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
junction = "1"
ureq = { version = "2", features = ["json"] }
percent-encoding = "2"
rayon = "1"
strsim = "0.11"
url = "2"
